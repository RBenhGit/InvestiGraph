[project]
name = "financial-charts"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Ran Benur", email = "ran@benhur.co" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "yfinance>=1.5.1",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
