<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valuation Table</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      th { cursor: pointer; user-select: none; }
      th:hover { color: var(--ink); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="masthead">
        <div class="masthead-bar"></div>
        <div class="masthead-inner">
          <div class="wordmark">
            Fair Value Ledger <small>Valuations</small>
          </div>
          <div>
            <a href="/" class="about-link">Back to Calculator</a>
          </div>
        </div>
      </header>

      <div class="hero">
        <p class="lede">Latest Base Scenario valuations across all tickers.</p>
        <div class="querybar">
          <input id="filter-input" class="assumption-input" type="text" placeholder="Filter ticker or evaluator..." style="width: 15rem;" />
        </div>
      </div>

      <div class="history-table-container">
        <table class="history-table" id="valuations-table">
          <thead>
            <tr>
              <th data-sort="ticker">Ticker ⇕</th>
              <th data-sort="price">Current Price ⇕</th>
              <th data-sort="lynch" class="th-b">Lynch Base FV ⇕</th>
              <th data-sort="lynch-pct" class="th-b">Lynch Diff ⇕</th>
              <th data-sort="rule1" class="th-a">Rule #1 Base FV ⇕</th>
              <th data-sort="rule1-pct" class="th-a">Rule #1 Diff ⇕</th>
              <th data-sort="evaluator">Evaluator ⇕</th>
            </tr>
          </thead>
          <tbody id="valuations-tbody"></tbody>
        </table>
      </div>
    </div>
    <script src="/valuations.js"></script>
  </body>
</html>
